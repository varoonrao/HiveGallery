
name: Build Hive V1 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug -PhiveVersion=1.0.0 -PhiveCode=1

      - name: Verify and prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HiveGallery-v1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/HiveGallery-v1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HiveGallery-v1
          path: dist/HiveGallery-v1.apk
          if-no-files-found: error
