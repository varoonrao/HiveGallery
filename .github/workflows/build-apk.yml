name: Build Hive V1.1 APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager --version
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug -PhiveVersion=1.1.0 -PhiveCode=2 --stacktrace
      - name: Verify and prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HiveGallery-v1.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/HiveGallery-v1.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HiveGallery-v1.1
          path: dist/HiveGallery-v1.1.apk
          if-no-files-found: error
          retention-days: 30
